{%- comment -%}
  The menu is a checkbox, so this needs no JavaScript.
{%- endcomment -%}

<header class="site-header">
  <div class="container site-header__inner">

    <a class="site-header__brand" href="{{ '/' | relative_url }}">
      <img class="site-header__icon"
           src="{{ '/assets/icon/appicon-180.png' | relative_url }}"
           alt="" width="30" height="30">
      <span class="site-header__name">{{ site.app_name }}</span>
    </a>

    <input type="checkbox" id="nav-toggle-state" class="nav-toggle-state" aria-controls="primary-nav">
    <label for="nav-toggle-state" class="nav-toggle">Menu</label>

    <nav class="site-nav" id="primary-nav" aria-label="Primary">
      <ul>
        {%- for item in site.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {%- endfor %}
        <li class="site-nav__download"><a href="{{ site.appstore_link }}">Get Saucier on the App Store</a></li>
      </ul>
    </nav>

    <a class="btn btn--primary site-header__cta" href="{{ site.appstore_link }}">Get Saucier</a>

  </div>
</header>
