---
layout: default
---

<div class="container container--narrow">
  <header class="page-header">
    <h1>{{ page.heading | default: page.title }}</h1>
    {%- if page.lead %}
    <p class="page-header__lead">{{ page.lead }}</p>
    {%- endif %}
    {%- if page.updated %}
    <p class="page-header__meta">Last updated {{ page.updated }}</p>
    {%- endif %}
  </header>

  <article class="prose">
    {{ content }}
    {% include faq.html %}
  </article>
</div>

{% include cta.html %}
