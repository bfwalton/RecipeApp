# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
# `url` must stay in sync with CNAME. Canonical tags, the sitemap and every
# social preview are built from it, so a wrong value here quietly breaks all
# three at once.
url                 : "https://www.saucier-app.com"
baseurl             : ""

app_name            : Saucier
tagline             : Save any recipe. Cook it hands-free.

# Shown as the <title> on the home page and as the fallback everywhere else.
title               : "Saucier — Save Any Recipe, Cook It Hands-Free"
description         : "Save recipes from websites and social posts, plan the week and cook hands-free with Saucier for iPhone and iPad. Free, private, no account."

# ---------------------------------------------------------------------------
# App
# ---------------------------------------------------------------------------
ios_app_id          : 1535998412
appstore_link       : "https://apps.apple.com/us/app/saucier/id1535998412"
app_price           : Free
app_icon            : /assets/icon/appicon-512.png
support_email       : help@saucier-app.com
author              : Brandon Walton

# Minimum supported OS, quoted in copy and in structured data.
requires_os         : iOS 26.0 or later
platforms           : iPhone, iPad

# Default social sharing image. Pages may override with `image:` front matter.
og_image            : /assets/img/og-default.png

enable_smart_app_banner : true

# ---------------------------------------------------------------------------
# Navigation — order matters, this drives the header and the footer
# ---------------------------------------------------------------------------
nav:
  - title: Features
    url: /features/
  - title: Meal Planning
    url: /meal-planning/
  - title: Ask Saucier
    url: /ai-recipe-assistant/
  - title: Cook Mode
    url: /hands-free-cooking/
  - title: Import
    url: /import-recipes/
  - title: FAQ
    url: /FAQ/

footer_nav:
  - title: Features
    url: /features/
  - title: Meal Planning
    url: /meal-planning/
  - title: Ask Saucier
    url: /ai-recipe-assistant/
  - title: Cook Mode
    url: /hands-free-cooking/
  - title: Save from Instagram & TikTok
    url: /save-recipes-from-instagram-tiktok/
  - title: Import your recipes
    url: /import-recipes/
  - title: Paprika alternative
    url: /paprika-alternative/

footer_support:
  - title: Help & Support
    url: /help/
  - title: FAQ
    url: /FAQ/
  - title: What's New
    url: /changelog/
  - title: Privacy Policy
    url: /privacypolicy/
  - title: Terms of Service
    url: /termsofservice/

# ---------------------------------------------------------------------------
# Jekyll
# ---------------------------------------------------------------------------
sass:
  style: compressed

plugins:
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Pages that exist for machines or humans but should not be advertised in the
# sitemap as content worth ranking.
defaults:
  - scope:
      path: "404.html"
    values:
      sitemap: false
